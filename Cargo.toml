[workspace]
resolver = "2"
members = ["crates/ns-sys", "crates/ns-core", "crates/ns-gguf", "crates/ns-model", "crates/ns-engine", "crates/ns-tok", "crates/nextsycl"]

[workspace.package]
version = "0.0.0"  # the release version is yy.mmdd.### from git (version.sh), handed in as NS_VERSION
edition = "2021"
license = "MIT"

[workspace.dependencies]
ns-gguf = { path = "crates/ns-gguf" }
ns-model = { path = "crates/ns-model" }
ns-core = { path = "crates/ns-core" }
ns-engine = { path = "crates/ns-engine" }
ns-tok = { path = "crates/ns-tok" }
serde_json = "1"

[profile.release]
debug = 1
