[workspace]
resolver = "2"
# the layout (docs/architecture.md): the shared foundation (crates/), one group a kind - its contract and one engine
# crate an architecture (llm/, image/, video/) -, the glue that makes them a service (glue/), the program (cli/)
members = [
    "crates/sys", "crates/core", "crates/gguf", "crates/tok", "crates/diffusion", "crates/qwen3vl",
    "crates/mesh", "crates/remover", "crates/codec12hz",
    "model3d/contract",
    "model3d/example", "model3d/hunyuan3d", "model3d/animateanymesh", "model3d/unirig", "model3d/rignet", "model3d/trellis2",
    "llm/contract", "llm/glm5next", "llm/qwen4exp", "llm/qwen35", "llm/deepseek2", "llm/deepseek4", "llm/deepseek41", "llm/museglimmer", "llm/nemotronh", "llm/example",
    "image/contract", "image/example", "image/qwenimage21", "image/unlimitedocr", "image/paddleocrvl", "image/olmocr2", "image/hunyuanimage21", "image/starvector", "image/upscale", "image/mingimage",
    "video/contract", "video/example", "video/h3",
    "audio/contract", "audio/example", "audio/minimaxmusic3", "audio/qwen3tts", "audio/voxcpm2", "audio/breezetts2", "audio/vibevoice",
    "audio/s2pro", "audio/voxtraltts", "audio/whisper", "audio/acestep",
    "glue/models", "glue/serve",
    "cli/nextsycl",
]

[workspace.package]
version = "0.0.0"  # the release version is yy.mmdd.### from git (version.sh), handed in as NS_VERSION
edition = "2021"
license = "MIT"

[workspace.dependencies]
nextsycl-sys = { path = "crates/sys" }
nextsycl-core = { path = "crates/core" }
nextsycl-gguf = { path = "crates/gguf" }
nextsycl-tok = { path = "crates/tok" }
nextsycl-diffusion = { path = "crates/diffusion" }
nextsycl-qwen3vl = { path = "crates/qwen3vl" }
nextsycl-mesh = { path = "crates/mesh" }
nextsycl-remover = { path = "crates/remover" }
nextsycl-codec12hz = { path = "crates/codec12hz" }
nextsycl-llm = { path = "llm/contract" }
nextsycl-llm-glm5next = { path = "llm/glm5next" }
nextsycl-llm-qwen4exp = { path = "llm/qwen4exp" }
nextsycl-llm-qwen35 = { path = "llm/qwen35" }
nextsycl-llm-nemotronh = { path = "llm/nemotronh" }
nextsycl-llm-museglimmer = { path = "llm/museglimmer" }
nextsycl-llm-deepseek2 = { path = "llm/deepseek2" }
nextsycl-llm-deepseek4 = { path = "llm/deepseek4" }
nextsycl-llm-deepseek41 = { path = "llm/deepseek41" }
nextsycl-llm-example = { path = "llm/example" }
nextsycl-image = { path = "image/contract" }
nextsycl-image-example = { path = "image/example" }
nextsycl-image-qwenimage21 = { path = "image/qwenimage21" }
nextsycl-image-unlimitedocr = { path = "image/unlimitedocr" }
nextsycl-image-paddleocrvl = { path = "image/paddleocrvl" }
nextsycl-image-olmocr2 = { path = "image/olmocr2" }
nextsycl-image-hunyuanimage21 = { path = "image/hunyuanimage21" }
nextsycl-image-starvector = { path = "image/starvector" }
nextsycl-image-upscale = { path = "image/upscale" }
nextsycl-image-mingimage = { path = "image/mingimage" }
nextsycl-video = { path = "video/contract" }
nextsycl-video-example = { path = "video/example" }
nextsycl-video-h3 = { path = "video/h3" }
nextsycl-audio = { path = "audio/contract" }
nextsycl-audio-example = { path = "audio/example" }
nextsycl-audio-minimaxmusic3 = { path = "audio/minimaxmusic3" }
nextsycl-audio-qwen3tts = { path = "audio/qwen3tts" }
nextsycl-audio-voxcpm2 = { path = "audio/voxcpm2" }
nextsycl-audio-breezetts2 = { path = "audio/breezetts2" }
nextsycl-audio-vibevoice = { path = "audio/vibevoice" }
nextsycl-audio-s2pro = { path = "audio/s2pro" }
nextsycl-audio-voxtraltts = { path = "audio/voxtraltts" }
nextsycl-audio-whisper = { path = "audio/whisper" }
nextsycl-audio-acestep = { path = "audio/acestep" }
nextsycl-model3d = { path = "model3d/contract" }
nextsycl-model3d-example = { path = "model3d/example" }
