[workspace]
resolver = "2"
# the layout (docs/architecture.md): the shared foundation (crates/), one group a kind - its contract and one engine
# crate an architecture (llm/, image/, video/) -, the glue that makes them a service (glue/), the program (cli/)
members = [
    "crates/sys", "crates/core", "crates/gguf", "crates/tok", "crates/diffusion", "crates/qwen3vl",
    "llm/contract", "llm/glm5next", "llm/qwen4exp", "llm/example",
    "image/contract", "image/example", "image/qwenimage21",
    "video/contract", "video/example", "video/h3",
    "audio/contract", "audio/example", "audio/minimaxmusic3", "audio/qwen3tts", "audio/voxcpm2",
    "glue/models", "glue/serve",
    "cli/nextsycl",
]

[workspace.package]
version = "0.0.0"  # the release version is yy.mmdd.### from git (version.sh), handed in as NS_VERSION
edition = "2021"
license = "MIT"

[workspace.dependencies]
nextsycl-sys = { path = "crates/sys" }
nextsycl-core = { path = "crates/core" }
nextsycl-gguf = { path = "crates/gguf" }
nextsycl-tok = { path = "crates/tok" }
nextsycl-diffusion = { path = "crates/diffusion" }
nextsycl-qwen3vl = { path = "crates/qwen3vl" }
nextsycl-llm = { path = "llm/contract" }
nextsycl-llm-glm5next = { path = "llm/glm5next" }
nextsycl-llm-qwen4exp = { path = "llm/qwen4exp" }
nextsycl-llm-example = { path = "llm/example" }
nextsycl-image = { path = "image/contract" }
nextsycl-image-example = { path = "image/example" }
nextsycl-image-qwenimage21 = { path = "image/qwenimage21" }
nextsycl-video = { path = "video/contract" }
nextsycl-video-example = { path = "video/example" }
nextsycl-video-h3 = { path = "video/h3" }
nextsycl-audio = { path = "audio/contract" }
nextsycl-audio-example = { path = "audio/example" }
nextsycl-audio-minimaxmusic3 = { path = "audio/minimaxmusic3" }
nextsycl-audio-qwen3tts = { path = "audio/qwen3tts" }
nextsycl-audio-voxcpm2 = { path = "audio/voxcpm2" }
nextsycl-models = { path = "glue/models" }
nextsycl-serve = { path = "glue/serve" }
serde_json = "1"

[profile.release]
debug = 1
