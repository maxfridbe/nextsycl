# Haru-4B (full-duplex spoken dialogue in lockstep at 7.5 Hz; /v1/realtime)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# higurashi-ai/Haru-4B @ 8d6e83bc (Apache-2.0 code and weights): one model.safetensors in bfloat16 - the language model
# (Qwen3.5-4B's text layers), the two audio projectors, the MeanFlow head and the causal VibeVoice codec - with its
# config.json and tokenizer.json. audio/haru reads the safetensors as they are (bfloat16 matrices on the card,
# 9.9 GiB loaded); one conversation holds its context (NS_HARU_CTX, an hour: 1.0 GiB). docs/ports/haru-4b.md has the checks.
id: haru-4b
kind: audio
arch: haru
license: apache-2.0
commercial: true
license_note: 'Apache-2.0 code and weights (higurashi.ai); a pretrained base model, released for research - it holds a natural conversation but is not a reliable source of facts and does not follow instructions as an assistant does; it imitates the voice of a reference clip: clone only your own voice or one you have permission to use'
title: 'Haru-4B (full-duplex voice conversation in lockstep; Rust + SYCL)'
about: 'A live voice conversation over /v1/realtime in lockstep: every 133 ms one frame of your audio in, one frame of its own out (silence included), so it listens while it speaks - back-channels, interruptions and overlaps are its own. A character card (persona, names, relationship, situation; nine languages) sets who it is, a saved voice (3 s - 3 min of one speaker) how it sounds. One card'
gpus: '0|1'
vram_gib: 11.5                   # measured on the B65: 9.9 GiB loaded, 10.9 with a conversation of an hour (28,672 positions)
speech:
- realtime                       # a live conversation: /v1/realtime (lockstep below; a saved voice's recording is its voice). It
                                 #   does not read text aloud: no clone / voices here, so speech requests never come to it
- lockstep                       # a frame of audio in, a frame out, every 133 ms (the row says lockstep: true)
annotations_note: 'None: Haru-4B does not read text aloud - it holds a spoken conversation over /v1/realtime; its character card (persona, names, situation) is plain prose.'
annotations: []
defaults:
  seconds: 20.0
env: {}
