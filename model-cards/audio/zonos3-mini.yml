# ZONOS3-Mini (Zyphra: multilingual speech at 44.1 kHz in preset voices or a voice cloned from a recording; steering)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# The files are Zyphra's own GGUF conversions (Zyphra/ZONOS3-Mini, gguf/, pinned at d2d142a8): the backbone (Q4_0
# experts, Q8_0 mixers, the tokenizer, condition tables and the codec's silence frame inside; the edit build: the release
# LM with the phoneme, start and pause rows and speech editing's vocabulary - on plain text the release LM bit for bit), the ZAC codec's MR-iSTFT
# decoders (keep2_plain, the default; full_mr, loaded on the first request that names it), the MECT-B2 speaker
# encoder, the reference encoder and its Wav2Vec2-BERT teacher (raw-reference cloning: a recording's own codes, loaded
# for the encode and freed after it), speech editing's adapter (edit/accents.gguf: the edit LoRA) and Zyphra's FuseAlign
# aligner (Zyphra/fusealign, Apache-2.0: word timings; loaded for an edit), LACI's alignment heads (laci/, a language a file: LACI and short texts), the steering
# bundle, and the 27 preset voices' codes (.codes.npy: the reference prefix, the model's default)
# and speaker embeddings (.embedding.npy). Apache-2.0 (the weights; the runtime this port follows is MIT).
id: zonos3-mini
kind: audio
arch: zonos3
title: 'ZONOS3-Mini (speech in 43 languages at 44.1 kHz: 27 preset voices, a voice cloned from a recording, steering of pace and emotion)'
about: 'Zyphra''s ZONOS3-Mini in Rust and SYCL: an 11-layer backbone of 1024 (gated DeltaNet mixers with a global-attention layer in four, Full AttnRes instead of the residual stream, a top-2-of-64 latent MoE) reads SuperBPE text after a voice and writes ten 4096-code books at 15 Hz; the ZAC codec''s MR-iSTFT decoder makes 44.1 kHz. Voices: a preset (voice: savannah, rupert, ...; its shipped codes as a reference prefix, or option speaker-mode embedding), or a recording (ref_audio, a saved voice) cloned by the MECT-B2 speaker encoder''s embedding, or with option speaker-mode reference by its own codes (raw-reference cloning: the reference encoder, 6.3 GiB more for about 6 s on a B70, then freed). options: controls (steering: delivery.tempo, emotions.*, mood.*, delivery.whisper ...), speaking-rate, decoder full, temperature; cfg is speaker guidance (1: off)'
license: apache-2.0
commercial: true
gpus: '0'
vram_gib: 2.5                    # measured 2026-11-16 on the B70 and B65: 1.81 GiB loaded (backbone 0.8, keep2 decoder 0.7, edit adapter 0.25,
                                 # speaker encoder), 2.2 GiB at the peak of a 54 s take
headroom_gib: 1.0                # a long take's decoder activations; raw-reference cloning and edits load the reference encoder (+6.3 GiB at the
                                 # peak, 8.1 GiB in all, freed after), decoder full 4 GiB more on first use
speech:
- voices
- clone
- edit
voices: [savannah, wyatt, rupert, imogen, cillian, jett, morgana, sakura, thaddeus, willow, gaspard, liesel, wolfgang, ananya, arjun, ginevra, lorenzo, minjun, seoyeon, haoran, meilin, leonor, thiago, rodrigo, ximena, chaitanya, sravya, none]   # the presets (voice-<name> files below); none: no voice (unconditioned)
annotations_note: 'Any other bracketed text (`(laugh)`, `[laugh]`, `<laugh/>`) is not a tag: ZONOS3-Mini has no trained non-verbal tags (Zyphra: angle-bracket strings are ordinary text). Numbers, money, dates, times and units are said as words by Zyphra''s normalizer in the request''s language (option normalize off: as written).'
annotations:
- syntax: '[pause] [pause 0.25|0.5|1|2]'
  keep: '\[pause(?: [0-9.]+s?)?\]'
  does: 'a pause after a word (the nearest of the model''s four trained buckets, nominally 0.25 / 0.5 / 1 / 2 s); the model shortens long ones'
  tested: 'verified 2026-11-15: "One.[pause 2] Two.[pause 2] Three, and four." in Rupert''s embedding, 8 seeds: the two longest pauses 0.53 s on average (0.30 s unmarked); Zyphra''s runtime, same text, voice and seeds: 0.52 s (0.28 s unmarked) - the model says a 2 s pause marker as about half a second, in both; never read aloud. nextsycl 2026-11-16 (B70, through the audio server): 0.55 s marked, 0.30 s unmarked over the same 8 seeds; Whisper heard "One, two, three and four."'
- syntax: '[start]'
  keep: '\[start\]'
  does: 'first in the text, once: speech from the first frame (no lead-in silence)'
  tested: 'verified 2026-11-15: becomes the start token, ids identical to Zyphra''s runtime (nextsycl 2026-11-16 too, with no silence prefill after it, as Zyphra''s server); audible onset not measured'
- syntax: '[ipa təmɑːtoʊ]'
  keep: '\[ipa [^\]]*\]'
  does: 'a word said as the IPA written (the model''s 136 phone symbols; stress marks and syllable dots dropped)'
  tested: 'verified 2026-11-15: token ids identical to Zyphra''s runtime; Whisper heard "tomato" where written - the vowel itself not measured. nextsycl 2026-11-16: ids identical to Zyphra''s runtime; "I would like a [ipa təmɑːtoʊ], please." in Rupert''s embedding, seeds 1-4: Whisper heard "tomato" once ("liken Matto", "a no, toe", "to motto" the others)'
- syntax: '[steer ID=DOSE, ...]words[/steer]'
  keep: '\[steer [^\]]*\]|\[/steer\]'
  does: 'hidden-space steering over these words alone, ramped in and out over 0.2 s: emotions.* (happy, sad, angry ...), mood.valence / arousal / ..., delivery.whisper / loud / tempo / conversational, expressive.expressive, disfluency.disfluent, emphasis_nv_nodur.emphasis (doses about -4..4)'
  tested: 'verified 2026-11-15: [steer delivery.whisper=4] over a clause dropped its voicing (autocorrelation 0.22-0.35 against 0.72-0.77 unsteered) and it came back after the span; nextsycl 2026-11-16: kept through the audio server and never read aloud (Whisper heard the words alone), the voicing not measured'
- syntax: '(laugh) [laugh] <laugh/>'
  does: 'nothing trained: (laugh) is read aloud; [laugh] and <laugh/> were dropped on the take tested at the engine - through the audio server''s speech text pass the brackets become pauses and the word is read, and <laugh/> is said as "less than laugh slash greater than"'
  tested: 'verified 2026-11-15: Whisper heard "Loth" for (laugh) and no word for [laugh] or <laugh/>; nextsycl 2026-11-16 through the audio server: "Well, laugh, that is funny. Laugh, indeed, less than laugh slash greater than, isn''t it?"'
defaults:
  seconds: 60.0
  cfg: 1.0
env: {}
