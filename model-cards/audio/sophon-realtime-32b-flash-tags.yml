  thinker-1: sophon-flash-thinker-01
  thinker-2: sophon-flash-thinker-02
  thinker-3: sophon-flash-thinker-03
  thinker-4: sophon-flash-thinker-04
  thinker-5: sophon-flash-thinker-05
  thinker-6: sophon-flash-thinker-06
  thinker-7: sophon-flash-thinker-07
