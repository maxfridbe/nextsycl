# Sophon-Realtime 32B Flash, tags (its own fine-tuned talker: sound tags performed; a cloned voice less like its recording)
# model card (model-cards/README.md): sophon-realtime-32b-flash.yml (its files are defined there) with the release's own
# talker in place of Qwen3-TTS-12Hz-1.7B-Base: talker/model.safetensors of adventists-ai/Sophon-Realtime-32B-Flash @
# 13b33529, Base fine-tuned to perform sound tags (NOTICE: "the language model was fine-tuned to perform sound tags";
# its speaker encoder is Base's, tensor for tensor). Tags performed (NS_SOPHON_TAGS left at 1); a saved voice cloned
# from its recording keeps its words but drifts from the recording: ZONOS3 speaker similarity 0.47-0.74 against Base's
# 0.55-0.84 (four saved voices, three seeds, two lines, 2026-11-17: docs/ports/sophon-realtime.md, Talkers).
id: sophon-realtime-32b-flash-tags
kind: audio
arch: sophon-realtime
license: apache-2.0
commercial: true
license_note: 'Apache-2.0 code and weights (Adventists AI: the thinker and this talker, upstream''s fine-tune of Qwen3-TTS-12Hz-1.7B-Base); derived from Qwen3-VL-32B-Instruct, Qwen3-ASR and Qwen3-TTS-12Hz-1.7B-Base (Qwen, Apache-2.0); the release asks that only your own voice, or one you have permission to use, be cloned'
title: 'Sophon-Realtime 32B Flash, tags (full-duplex voice conversation; its own talker performs [laughter], [sigh]; Rust + SYCL)'
about: 'A live voice conversation over /v1/realtime (OpenAI Realtime events): the 32B brain hears your speech itself, decides when you have finished (DuplexJev''s turn question) and writes a reply with sound tags ([laughter], [sigh], <strong>); the release''s own talker (Qwen3-TTS Base fine-tuned by Adventists AI) speaks it as it is written and performs the tags; barge-in, tool calls, built-in voices (chelsie, brand) or a saved voice cloned from its recording - less like the recording than sophon-realtime-32b-flash''s Base talker makes it. The brain q4 on the first card, the voice on the second'
gpus: '0,1'
spans: true                      # one copy over both cards (audio start --gpus 0,1): the brain on the first, the talker on the second
vram_gib: 25.5                   # the brain's card (q4, 16K context: +2.5 GiB over 6K, 2026-11-19)
vram_gib_per_card: [25.5, 6.2]   # the brain's card, the talker's (its cache for 8,192 frames, ~0.9 GiB)
speech:
- clone                          # a saved voice (its recording's x-vector), or a recording
- realtime                       # a live conversation: /v1/realtime
- events                         # sound tags in the text performed: the annotations
annotations_note: 'Its sound tags, kept as written in a text to speak (the engine''s markup()) and handed to the talker as upstream hands them; in a /v1/realtime conversation its own replies carry them (strip them for display). Performed, not read, by this entry''s talker (the release''s own): heard 2026-11-16 through the talker''s speech path (a build copy, `audio check --stages speak`, voice chelsie, seeds 1-3, Whisper large-v3-turbo), the tag''s word written in 1 of 21 takes ([quick_breath] once). sophon-realtime-32b-flash''s talker, Qwen3-TTS-12Hz-1.7B-Base, reads every tag aloud (21 of 21), so that entry takes them out. Not checked in a /v1/realtime conversation.'
annotations:
- syntax: '[laughter]'
  keep: '\[laughter\]'
  does: 'a laugh where it stands (upstream: 77% en / 83% zh)'
  tested: 'verified 2026-11-16, performed (Flash talker, voice chelsie, seeds 1-3, "They would be bagels! [laughter] Oh, that is a classic."): Whisper wrote no tag word in 3 of 3; the gap between "bagels" and "Oh" 1.20 / 1.34 / 1.22 s with 0.81 / 0.43 / 0.48 s of sound above -40 dBFS, against 0.28 / 0.48 / 0.58 s and 0.08 / 0.10 / 0.11 s for the line without the tag; upstream''s own path (talker_ref.py, greedy) the same: a 2.1 s laugh of short bursts there'
- syntax: '[breath]'
  keep: '\[breath\]'
  does: 'a breath where it stands'
  tested: 'verified 2026-11-16, performed (Flash talker, voice chelsie, seeds 1-3, "Okay, here we go. [breath] Let us start the meeting now."): no tag word in 3 of 3; the gap "go" - "Let" 1.72 / 1.54 / 0.88 s with 0.29 / 0.54 / 0.42 s of sound, without the tag 0.24 / 0.26 / 0.68 s with 0.04 / 0.01 / 0.04 s'
- syntax: '[sigh]'
  keep: '\[sigh\]'
  does: 'a sigh where it stands (upstream: 100% en / 90% zh)'
  tested: 'verified 2026-11-16, performed (Flash talker, voice chelsie, seeds 1-3, "Well, I suppose we have to start over. [sigh] Fine, let us do it."): no tag word in 3 of 3; the gap "over" - "Fine" 1.48 / 1.18 / 0.96 s with 0.70 / 0.32 / 0.36 s of sound, without the tag 0.50 / 0.62 / 0.34 s with 0.06 / 0.07 / 0.08 s'
- syntax: '[cough]'
  keep: '\[cough\]'
  does: 'a cough where it stands - weak in English (upstream: 50% en / 90% zh)'
  tested: 'verified 2026-11-16, weak (Flash talker, voice chelsie, seeds 1-3, "Excuse me, [cough] as I was saying, the meeting is at noon."): no tag word in 3 of 3; the take ~1 s longer than without the tag, but the gap "me" - "as" holds 0.03 / 0.02 / 0.15 s of sound against 0.05 / 0.06 / 0.08 s: a cough heard in one take at most'
- syntax: '[quick_breath]'
  keep: '\[quick_breath\]'
  does: 'a quick breath where it stands; sometimes read aloud'
  tested: 'verified 2026-11-16, mostly performed (Flash talker, voice chelsie, seeds 1-3, "Okay, here we go. [quick_breath] Let us start the meeting now."): "Quick breath." written in 1 of 3; the other two a gap "go" - "Let" of 0.78 / 1.84 s with 0.10 / 0.12 s of sound'
- syntax: '<laughter>...</laughter>'
  keep: '<laughter>[^<\n]{0,300}</laughter>'
  does: 'the words spoken laughing (upstream: 71% en / 78% zh)'
  tested: 'verified 2026-11-16, tags not read (Flash talker, voice chelsie, seeds 1-3, "I cannot believe it. <laughter>You actually did it, you crazy person.</laughter> Well done."): Whisper wrote the words only, 3 of 3; the takes 0.6-1.4 s longer than without the tags, the gap "person" - "Well" 0.84 / 1.18 / 0.74 s with 0.13 / 0.30 / 0.21 s of sound against 0.58 / 0.36 / 0.50 s with 0.10 / 0.06 / 0.06 s; laughing in the words themselves not measured'
- syntax: '<strong>...</strong>'
  keep: '<strong>[^<\n]{0,300}</strong>'
  does: 'the words stressed - weak in this build (upstream says so)'
  tested: 'verified 2026-11-16, not read, stress unreliable (Flash talker, voice chelsie, seeds 1-3, "No, I said the <strong>blue</strong> one, not the red one."): no tag word in 3 of 3; "blue" -1.9 / +4.1 / +0.8 dB against the whole line, without the tags -0.7 / +1.0 / +0.9'
defaults:
  seconds: 60.0
env:
  NS_SOPHON_CLONE: xvector        # this talker ends its speech early in context (2026-11-17): a saved voice by its x-vector, upstream's way
