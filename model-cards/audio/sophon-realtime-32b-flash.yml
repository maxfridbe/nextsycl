# Sophon-Realtime 32B Flash (full-duplex voice conversation: a 32B brain that listens; its voice Qwen3-TTS Base's - a saved voice as recorded; /v1/realtime)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# adventists-ai/Sophon-Realtime-32B-Flash @ 13b33529 (Apache-2.0): the thinker (DuplexJev-32B-Para: Qwen3-ASR's audio
# encoder, an Ultravox projector and Qwen3-VL-32B's language model with a merged tag-writing adapter, FP8 a channel)
# and the release's voices; the talker is Qwen3-TTS-12Hz-1.7B-Base itself (qwen3-tts-base.yml's file), not the
# release's fine-tune of it: a saved voice cloned from its recording sounds closer to it (ZONOS3 speaker similarity
# 0.55-0.84 against 0.47-0.74, four saved voices, 2026-11-17: docs/ports/sophon-realtime.md, Talkers), but Base reads a
# sound tag aloud, so the talker is not handed them (NS_SOPHON_TAGS 0). sophon-realtime-32b-flash-tags.yml is the
# same model with the release's talker: tags performed. The vision tower's file is not taken (the audio path does not
# read it). The brain's matrices are made 4-bit on the card as it loads (NS_SOPHON_BITS=4, audio/sophon brain.rs) -
# one card; the talker on the other. docs/ports/sophon-realtime.md has the checks.
id: sophon-realtime-32b-flash
kind: audio
arch: sophon-realtime
license: apache-2.0
commercial: true
license_note: 'Apache-2.0 code and weights: the thinker and voices Adventists AI''s (derived from Qwen3-VL-32B-Instruct and Qwen3-ASR, Qwen, Apache-2.0), the talker Qwen3-TTS-12Hz-1.7B-Base itself (Qwen, Apache-2.0); the release asks that only your own voice, or one you have permission to use, be cloned'
title: 'Sophon-Realtime 32B Flash (full-duplex voice conversation; a saved voice as recorded, no sound tags; Rust + SYCL)'
about: 'A live voice conversation over /v1/realtime (OpenAI Realtime events): the 32B brain hears your speech itself, decides when you have finished (DuplexJev''s turn question) and writes a reply; Qwen3-TTS-12Hz-1.7B-Base speaks it as it is written, in a saved voice cloned from its recording (the closest to it of the two Sophon entries) or a built-in one; barge-in, tool calls. The brain''s sound tags stay in its text but are not spoken (the -tags entry performs them). The brain q4 on the first card, the voice on the second'
gpus: '0,1'
spans: true                      # one copy over both cards (audio start --gpus 0,1): the brain on the first, the talker on the second
vram_gib: 23.0                   # the brain's card (q4, 6K context)
vram_gib_per_card: [23.0, 5.5]   # the brain's card, the talker's
speech:
- clone                          # a saved voice in context (its recording and Whisper's transcript; NS_SOPHON_CLONE icl), or a recording (with ref_text: in context)
- realtime                       # a live conversation: /v1/realtime
annotations_note: 'No sound tags: its talker, Qwen3-TTS-12Hz-1.7B-Base, reads a tag aloud ("Laughter.", 21 of 21 takes, 2026-11-16), so they are taken out of what it reads (NS_SOPHON_TAGS 0) - a [laughter] in a text to speak, or in the brain''s own reply, is silent; the reply''s text keeps them (strip them for display). For performed tags use sophon-realtime-32b-flash-tags (the release''s own talker), whose cloned voices sound less like their recordings (docs/ports/sophon-realtime.md, Talkers).'
annotations: []
defaults:
  seconds: 60.0
env:
  NS_SOPHON_TAGS: '0'             # Base reads a tag aloud ("Laughter."): the talker is not handed them; the reply text keeps them
  NS_SOPHON_CLONE: icl            # a saved voice in context (its recording's frames and transcript in the prompt): Base clones closest that way; x-vector when no transcript is known
