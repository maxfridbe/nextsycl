# OmniVoice Q8_0 (zero-shot speech in 646 languages, 24 kHz: voices cloned from a recording or designed from attributes;
# non-verbal tags; non-commercial)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
# License: the weights (and omnivoice.cpp's GGUF conversion of them) are CC BY-NC 4.0 - no commercial use (the training
# data's terms, Emilia among them); upstream's code Apache 2.0, the Higgs Audio v2 codec Apache 2.0. See the guide.
id: omnivoice
kind: audio
arch: omnivoice
title: 'OmniVoice Q8_0 (speech in 646 languages, 24 kHz: voices cloned from a recording and its transcript or designed from attributes, non-verbal tags; non-commercial)'
about: 'OmniVoice (k2-fsa / Xiaomi, 2026): a diffusion-language-model TTS - a bidirectional Qwen3-0.6B unmasks the 8 codebooks of the Higgs Audio v2 codec (25 frames a second) in 32 guided steps, the length set up front from the text; the codec''s decoder makes 24 kHz sound. omnivoice.cpp''s Q8_0 GGUFs (the backbone Q8_0, the codec''s convolutions half), expanded to half on the card. Voice cloning from a recording and its transcript, voice design from attributes (male / female; child to elderly; five pitches; whisper; ten English accents; twelve Chinese dialects), the two together, the model''s own voice otherwise; non-verbal tags ([laughter], [sigh], [question-en] ...); 646 languages. No built-in voices, no free-form instructions. Weights: CC BY-NC 4.0 (non-commercial)'
license: cc-by-nc-4.0
commercial: false
license_note: 'the weights CC BY-NC 4.0 (k2-fsa / Xiaomi; the training data''s terms); upstream''s code Apache 2.0, the Higgs Audio v2 codec (Boson AI) Apache 2.0, the GGUF conversion''s tooling (omnivoice.cpp) MIT'
gpus: '0,1'                     # whole on one of them, the first with room (the B70 first)
vram_gib: 2.6                   # its memory on the card when it runs (measured on a B65: 1.6 GiB loaded, 2.4 GiB at a 29 s recording's clone; its load asks 1.8)
speech:
- clone                         # a recording, or a saved voice, with its transcript
- design                        # a voice from attributes alone (instructions)
- direction                     # a clone steered by attributes (instructions)
- events                        # non-verbal tags in the text
- transcript                    # a clone needs what the recording says (saved voices without it go elsewhere)
annotations_note: 'Only these 13 tags are trained, case and spelling as written; other bracketed text is not a tag ([laugh] is read aloud: "Well, laugh, that is really funny", verified 2026-11-16). The voice is set by instructions (attributes below) or a recording, not by text.'
annotations:
- syntax: '[laughter]'
  keep: '\[laughter\]'
  does: 'a laugh where the tag stands'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, seed 7, male young adult design unless said): not read aloud (Whisper heard the line alone); +0.54 s of sound above -40 dBFS against the same line without it, +0.74 s in a clone (LibriSpeech 1272)'
- syntax: '[sigh]'
  keep: '\[sigh\]'
  does: 'a sigh where the tag stands (the length estimate gives it 0.8 s of its own; very short lines with it and no recording can still lose their word)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, male young adult design unless said; the words checked by Whisper over many seeds): not read aloud. Upstream''s length estimate counts the tag as its six letters (0.14 s more for "Oh well [sigh] maybe next time." after the short-line boost), so short lines lost their words to the sigh: that line kept them in 12 of 24 seeds (upstream''s own code: 12 of 24), "[sigh] Okay." 3 of 8. With the sigh''s own 0.8 s and a 2 s floor for the words without a recording (sigh-seconds, min-seconds): 16 of 16 and 16 of 16, "[sigh] Yes." 16 of 16, longer lines 7-8 of 8, clones 7-8 of 8; the sigh adds 0.4-1.3 s of sound against the line without it (+0.64 s in the card''s long line, seed 7). Still unreliable: "[sigh] Fine." in the model''s own voice 5 of 16 and "No [sigh]" 4 of 16 (upstream''s code: 4 of 8 and 1 of 8) - give such lines a recording or more words'
- syntax: '[confirmation-en]'
  keep: '\[confirmation-en\]'
  does: 'an English affirming sound (mm-hm)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, seed 7, male young adult design unless said): heard as "Hmm.", the tag''s word not read; quiet (+0.02 s above -40 dBFS)'
- syntax: '[question-en] [question-ah] [question-oh] [question-ei] [question-yi]'
  keep: '\[question-(?:en|ah|oh|ei|yi)\]'
  does: 'a questioning interjection (en: English; ah, oh, ei, yi: the Chinese ones)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, seed 7, male young adult design unless said): each heard as its sound, never the tag''s words: en no word (+0.58 s of sound), ah "Ah", oh "Oh", ei "A", yi "Ye"'
- syntax: '[surprise-ah] [surprise-oh] [surprise-wa] [surprise-yo]'
  keep: '\[surprise-(?:ah|oh|wa|yo)\]'
  does: 'a surprised interjection'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, seed 7, male young adult design unless said): each heard as its sound: ah "Ah", oh "Oh", wa "why", yo "Yo, yo" (+0.6-0.9 s of sound)'
- syntax: '[dissatisfaction-hnn]'
  keep: '\[dissatisfaction-hnn\]'
  does: 'a dissatisfied hmph'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65, seed 7, male young adult design unless said): heard as "Hmm" (+0.62 s of sound), the tag''s word not read'
- syntax: '[B EY1 S] (CMU phonemes in brackets, upper case, stress digits)'
  keep: '\[[A-Z]{1,3}[0-2]?(?: [A-Z]{1,3}[0-2]?)*\]'
  does: 'an English word said as the phonemes written; Chinese: pinyin with a tone digit in the text (ZHE4), no brackets'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65): "Please put the statue on its [B EY1 S] before the guests arrive." heard as "... its base ..."; pinyin unverified'
- syntax: 'instructions: male | female; child | teenager | young adult | middle-aged | elderly; very low | low | moderate | high | very high pitch; whisper; american | british | australian | canadian | indian | chinese | korean | japanese | portuguese | russian accent; a Chinese dialect (河南话 陕西话 四川话 贵州话 云南话 桂林话 济南话 石家庄话 甘肃话 宁夏话 青岛话 东北话); comma-separated, one a kind, or the Chinese names (男, 女, 青年, 低音调, 耳语 ...)'
  does: 'the voice designed (alone) or steered (with a recording); accents only for English text, dialects only for Chinese; anything else is refused (400, invalid_params, field instructions)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, B65): designs in English and Chinese heard word for word (docs/ports/omnivoice.md); "speak happily and fast" answered 400 with the list'
defaults:
  steps: 32
  cfg: 2.0
env: {}
