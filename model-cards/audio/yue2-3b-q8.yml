# YuE2-3B Q8_0 (songs with vocals from a style and lyrics: a score first, then the music; 48 kHz stereo; non-commercial)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# The files are scragnog's GGUF conversions of M-A-P's YuE2-3B (rev 1a96eca = 8f24312's weights, model.safetensors
# sha256 1d55c42c...) and YuE2-Vae (807ce9d5...), pinned at eb7de0903bf4dfbd14a2384ae0c0d14150cfa2c7. CC BY-NC 4.0:
# attribution, non-commercial use only (a commercial licence: the YuE2 team, gezhang@umich.edu).
# sheetsage2-f16.gguf (same repo and revision) is M-A-P's SheetSage2 (m-a-p/SheetSage2 on MERT-v2-FullSong, also CC BY-NC
# 4.0: attribution, non-commercial), HOT-Step's conversion of the adapters-merged weights: a recording to its lead sheet
# (ABC) - the score of a cover, sung by YuE2 in the request's style with the request's words.
id: yue2-3b-q8
kind: audio
arch: yue2
title: 'YuE2-3B Q8_0 (songs with vocals in English and Mandarin from a style and lyrics; a melody and chords score first; 48 kHz stereo; non-commercial, CC BY-NC 4.0)'
about: 'M-A-P''s YuE2-3B, non-commercial (CC BY-NC 4.0): one AR-NAR Mixture-of-Transformers backbone (28 layers of 2048, an AR and a NAR path a layer) writes an ABC score (cot full: melody and chords; melody; or off) and the semantic codes (25 a second, up to six minutes), then the acoustic latents by flow matching (32 midpoint steps), and YuE2-Vae (Oobleck, SnakeBeta) decodes 48 kHz stereo. The language model in Q8_0 (3.9 GB, every matrix kept in its blocks), the VAE float32. audio.generate: instructions the style, input the lyrics (section tags on lines of their own), seconds the most (the model ends the song), cfg the codes'' guidance (1; 1.01 for cot off), options cot and abc (a score to sing over: a cover''s melody, or an earlier song''s score with new words); the answer carries the score it sang over. A cover: audio a recording (its score by SheetSage2 - the melody for cot melody, the default then; melody and chords for cot full - sung in the new style with the words given: the song''s own or new ones; option score-only for the transcription alone; option instrumental true: the lead line stays in SheetSage2''s Ins voice and is played, not sung, no lyrics needed)'
license: cc-by-nc-4.0
commercial: false
gpus: '0,1'                      # a whole copy can run on either card (the B70 first); `audio gen --gpus 0,1` also splits one song: LM there, VAE here
vram_gib: 8.4                    # on one card: 8.27 GiB measured at the 360 s cap (B65; 8.14 at 234 s on both cards)
headroom_gib: 3.4                #   of it, beyond the 5.05 GiB of weights (the language model, the VAE, SheetSage2)
defaults:
  seconds: 360.0
  steps: 32
  cfg: 1.0
env: {}
