id: breeze-tts-2
kind: audio
arch: breeze-tts-2
license: breezeblue-research-non-commercial-1.1
commercial: false
license_note: 'BreezeBlue Research and Non-Commercial License 1.1 (RESONIA, Inc.): research and personal use only - no product, hosted service, organisation''s internal use or monetized content, the audio it makes included, without a separate commercial licence; clone a real voice only with that person''s explicit consent; the GGUF is cstr''s conversion under the same licence; the 12 Hz codec is Qwen3-TTS''s (Apache-2.0).'
title: 'Breeze TTS 2 Q8_0 (speech in English and Chinese, 24 kHz: voices designed, cloned or directed; vocal events; non-commercial)'
about: 'Breeze TTS 2 (BreezeBlue, a CSM fork, ~3B): a T5Gemma2 text encoder (26 layers), a Qwen3 backbone (28 layers) and a 12-layer depth decoder over the Qwen3-TTS 12 Hz codec''s 16 codebooks - CrispASR''s Q8_0 GGUF, half on the GPU. Voice design from a description, voice cloning from a recording and its exact transcript, voice direction (a cloned voice steered by an instruction), vocal events inline ("(laugh)", "[笑]"). Weights and outputs: BreezeBlue Research and Non-Commercial License 1.1 (research and non-commercial use only)'
gpus: '0'
vram_gib: 6.5                   # its memory on the card when it runs (measured on a B70: 5.4 GiB of weights, 6.1 GiB in a run)
speech:
- design
- clone
- direction
- events
- transcript                    # a clone needs what the recording says (saved voices without it go elsewhere)
annotations_note: 'Its vocal events, kept as written by the speech text pass (the engine''s markup()); other brackets and parentheses are still pauses. Direction goes in instructions. Heard 2026-11-16 (design voice, seeds 1-3, each against the same line and seed without it; Whisper large-v3-turbo; the stretch between the words either side): none is read aloud; the sigh, cough and throat-clear are short, quiet sounds in a pause (0.1-0.6 s of sound at -22 to -36 dBFS); the laughs, (laugh) and [笑], come out mostly as a pause with at most a faint chuckle.'
annotations:
- syntax: '(laugh)'
  keep: '\(laugh\)'
  does: 'mostly a pause (0.6-0.7 s), at most a faint chuckle: not a clear laugh'
  tested: 'verified 2026-11-16 (/v1/audio/speech, design voice, seeds 1-3, "I can''t believe you actually did that. (laugh) Let''s go home now." against the line without it): not read aloud; the pause between the sentences 0.62-0.70 s (without: 0.22-0.28 s) holding 0.04 / 0.23 / 0.16 s of sound above -40 dBFS (-44 to -29 dBFS): a pause, a faint chuckle in two of three'
- syntax: '(sigh)'
  keep: '\(sigh\)'
  does: 'a sigh'
  tested: 'verified 2026-11-16 (/v1/audio/speech, design voice, seeds 1-3, the same line with and without it): not read aloud; the pause where it stands 0.82-1.02 s (without: 0.28-0.30 s) with 0.26-0.31 s of mostly unvoiced sound at -34 to -36 dBFS: a soft, breathy sigh'
- syntax: '(cough)'
  keep: '\(cough\)'
  does: 'a cough'
  tested: 'verified 2026-11-16 (/v1/audio/speech, design voice, seeds 1-3, the same line with and without it): not read aloud; 0.46-0.86 s where it stands (without: 0.28-0.30 s) with 0.14-0.35 s of sound at -23 to -34 dBFS: a short cough'
- syntax: '(clears throat)'
  keep: '\(clears throat\)'
  does: 'a throat clear'
  tested: 'verified 2026-11-16 (/v1/audio/speech, design voice, seeds 1-3, the same line with and without it): not read aloud; 0.68-0.76 s where it stands (without: 0.28-0.30 s) with 0.20-0.38 s of half-voiced sound at -27 to -30 dBFS: a throat clear'
- syntax: '[笑]'
  keep: '\[笑\]'
  does: 'a laugh (Chinese): mostly a pause, at most a short faint sound'
  tested: 'verified 2026-11-16 (/v1/audio/speech, Chinese design voice, seeds 1-3, "我真不敢相信你做到了。[笑]我们回家吧。" against the line without it, Whisper in Chinese): not read aloud; 0.40-1.22 s between the sentences (without: 0-0.42 s) with 0.10-0.22 s of sound at -28 to -34 dBFS: a pause, a faint short sound, not a clear laugh'
- syntax: '[叹气]'
  keep: '\[叹气\]'
  does: 'a sigh (Chinese)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, Chinese design voice, seeds 1-3, the same line with and without it): not read aloud (Whisper wrote the sigh''s sound 唉 once); 0.46-0.68 s where it stands (without: 0-0.42 s) with 0.14-0.27 s of unvoiced sound at -26 to -36 dBFS: a short sigh'
- syntax: '[咳嗽]'
  keep: '\[咳嗽\]'
  does: 'a cough (Chinese)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, Chinese design voice, seeds 1-3, the same line with and without it): not read aloud (Whisper wrote 嗯 once); 0.68-0.96 s where it stands (without: 0-0.42 s) with 0.09-0.51 s of sound at -24 to -30 dBFS: a cough'
- syntax: '[清嗓子]'
  keep: '\[清嗓子\]'
  does: 'a throat clear (Chinese)'
  tested: 'verified 2026-11-16 (/v1/audio/speech, Chinese design voice, seeds 1-3, the same line with and without it): not read aloud (Whisper wrote the sound 咳咳 once); 0.82-1.74 s where it stands (without: 0-0.42 s) with 0.30-0.61 s of sound at -22 to -28 dBFS: a throat clear'
defaults:
  seconds: 60.0
  cfg: 4.0                      # used with an instruction (design, direction); a clone or plain read is unguided
