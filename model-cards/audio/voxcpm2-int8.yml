# VoxCPM2, its language models in int8 (less VRAM, faster)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: voxcpm2-int8
kind: audio
arch: voxcpm2
license: apache-2.0
commercial: true
license_note: 'VoxCPM2 (OpenBMB) Apache-2.0, weights and code.'
title: VoxCPM2, its language models in int8 (less VRAM, faster)
about: 'VoxCPM2: MiniCPM4 base (28 layers) and residual (8) language models, a local encoder and a local flow-matching DiT (12 layers each), AudioVAE V2 (16 kHz in, 48 kHz out) - OpenBMB''s checkpoint'
gpus: '0'
speech:
- design
- clone
annotations_note: 'Plain text: VoxCPM2 reads no inline tags. A designed voice''s description or a clone''s style goes in instructions, which the engine puts in parentheses before the text as VoxCPM2 reads it ("(a young woman, gentle voice)Hello"); parentheses written in the text itself become pauses.'
annotations: []
defaults:
  seconds: 60.0
  steps: 10
  cfg: 2.0
env:
  NS_VCP_INT8: '1'
files:
  model: vcp2-model
  config: vcp2-config
  tokenizer: vcp2-tokenizer
  vae: vcp2-vae
guide: guides/voxcpm2.md
