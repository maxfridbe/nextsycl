# VoxCPM2, its language models in int8 (less VRAM, faster)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: voxcpm2-int8
kind: audio
arch: voxcpm2
title: VoxCPM2, its language models in int8 (less VRAM, faster)
about: 'VoxCPM2: MiniCPM4 base (28 layers) and residual (8) language models, a local encoder and a local flow-matching DiT (12 layers each), AudioVAE V2 (16 kHz in, 48 kHz out) - OpenBMB''s checkpoint'
gpus: '0'
speech:
- design
- clone
defaults:
  seconds: 60.0
  steps: 10
  cfg: 2.0
env:
  NS_VCP_INT8: '1'
files:
  model: vcp2-model
  config: vcp2-config
  tokenizer: vcp2-tokenizer
  vae: vcp2-vae
guide: guides/voxcpm2.md
