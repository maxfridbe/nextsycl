# UniMate (the skeleton of a rigged mesh set in motion by a sentence: 60 frames at 30 fps as glTF skeletal animation; code MIT, weights CC BY-NC 4.0)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: unimate
kind: model3d
arch: unimate
title: 'UniMate (text-driven skeletal animation of a rigged GLB: 60 frames, joint rotations and a root path; weights CC BY-NC 4.0, non-commercial)'
about: Friedrich-M et al., SIGGRAPH Asia 2026 - flan-T5-base text, a graph spatio-temporal flow transformer (10 blocks of attention among a frame's joints with spectral rotary positions and a graph-distance bias, attention among a joint's frames, a SwiGLU MLP, adaLN from the time, the text and the rest pose) sampled by an adaptive Dormand-Prince ODE with guidance 3; float32; run directory unimate_uniml3d_f60_v3 (graph_adaln, step 150000, the EMA weights, trained on UniML3D). The checkpoint's licence is CC BY-NC 4.0 - research and other non-commercial use only; the code is MIT. Takes a rigged mesh (UniRig or RigNet output, or any GLB with a skin of at most 71 joints and a single root), reads the joints by rules (no LLM), and returns the same mesh with an animation on its skeleton
does: [animate]
gpus: '0'
vram_gib: 2.0                    # measured: about 1 GiB above idle sampled during a run (docs/3d.md); weights float32 (denoiser, flan-T5) and working buffers
defaults:
  cfg: 3.0
  frames: 60
  fps: 30
env: {}
