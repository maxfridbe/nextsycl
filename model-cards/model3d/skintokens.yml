# SkinTokens / TokenRig (a skeleton and skin weights for a mesh as one token sequence; MIT)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: skintokens
kind: model3d
arch: skintokens
title: 'SkinTokens / TokenRig (a skeleton and skin weights for any mesh, written as one token sequence; MIT)'
about: VAST-AI, 2026 - one Qwen3-shaped decoder (28 layers, width 896) over a Michelangelo shape encoding writes the skeleton's tokens and then four skin tokens a joint (codes of an FSQ-CVAE's 32,768-entry codebook); the skin VAE's decoder turns a joint's codes into its weights over 54,000 surface samples, carried to the mesh's vertices by the 8 nearest. Beam search with sampling as the demo; float32. The TokenRig checkpoint carries the skin VAE (bfloat16-rounded), so the standalone skin VAE file is optional and unused at inference; both are read as published, without Python
does: [rig]
gpus: '0'
vram_gib: 4.5                    # measured 3.7 GiB at the high point on a B70 rigging a 3.6K-vertex humanoid (the weights 3.0: float32 plus the decoder's bfloat16 copy; the beams' key / value pool grows with longer skeletons)
