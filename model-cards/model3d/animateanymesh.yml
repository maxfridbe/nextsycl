# AnimateAnyMesh (a mesh set in motion by a sentence; 16 frames as morph targets; Apache-2.0)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: animateanymesh
kind: model3d
arch: animateanymesh
title: 'AnimateAnyMesh (text-driven mesh animation: 16 frames as morph targets; Apache-2.0)'
about: Wu et al., ICCV 2025 - DyMeshVAE (neighbour attention over the mesh's edges, farthest-point trajectory tokens) and a 12-layer rectified-flow MMDiT conditioned on SD 1.5's CLIP-L text tower; float32; the output keeps the input mesh (UVs, textures) and adds one morph target a frame
does: [animate]
gpus: '0'
vram_gib: 1.5                    # measured 1.1 GiB on a B70 animating a 7.6K-vertex mesh (more vertices: a little more)
defaults:
  steps: 63
  cfg: 3.0
  frames: 16
  fps: 10
