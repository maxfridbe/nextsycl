# Hi3D v1.0 (a coarse mesh refined like its picture: geometry to 1024^3, or 1536^3; Hi3D Open License 1.0)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: hi3d-1.0
kind: model3d
arch: hi3d
license: hi3d-open-license-1.0
commercial: true
license_note: 'Hi3D Open License Agreement v1.0 (OCEANO HK HOLDING LIMITED) for the eight Hi3D files: commercial use allowed; a product or service using it above 200,000 monthly active users or USD 1,000,000 monthly revenue must notify the licensor and apply for a separate licence within 60 days; commercial integrations display "Powered by Hi3D 1.0" (linking http://hi3d.ai/); distributing the weights carries the Agreement, its NOTICE text and the Acceptable Use Policy (Schedule 1); outputs (meshes) that contain no Hi3D materials carry none of these duties. Third-party parts keep their own terms: TRELLIS / Pointcept / O-CNN code MIT, FlexiCubes Apache-2.0; the DINOv2-large weights Apache-2.0, CLIP ViT-L/14 MIT; BiRefNet MIT. A coarse mesh from hunyuan3d-2mini-turbo keeps the Hunyuan licence.'
title: 'Hi3D v1.0 (refines a coarse mesh like its picture: geometry to 1024^3; Hi3D Open License)'
about: 'Hi3D v1.0 on Sparc3D: the coarse mesh voxelized at 64^3, DINOv2-large (756 px) and CLIP ViT-L/14 condition two 1.8B sparse flow transformers (24 blocks of 2112, 25 Heun updates a pass, guided above sigma 0.7), a self-pruning sparse decoder to signed distances 8x finer and FlexiCubes - 512^3 in one pass, 1024^3 in two (re-voxelized at 128^3), 1536^3 in three; pieces under 0.5 % dropped, decimated to a million faces, recentred to unit radius. Geometry only; give it the picture and a coarse mesh of the same object (hunyuan3d-2mini-turbo makes one in seconds)'
does: [refine]
gpus: '0'
vram_gib: 14.0                   # its memory on the card when it runs (models load stage by stage)
