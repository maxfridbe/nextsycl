# Budget3D-Idol (one picture to 3D Gaussian splats, 50 guided steps, any token budget; Apache-2.0)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
id: budget3d-idol
kind: model3d
arch: budget3d-idol
title: 'Budget3D-Idol (a picture to 3D Gaussian splats at any token budget; Apache-2.0)'
about: 'BudgetAny''s Budget3D fine-tune of Sperid Labs'' Idol: DINOv3 ViT-H+/16 and FLUX.2 VAE tokens of the picture, a 378M flow transformer over 8,192 latent tokens and the camera (50 Euler steps, guidance 3) that runs at a token budget - the latent''s flattest regions, empty space first, merged into coarser tokens and refined back to every point - then Idol''s octree and Gaussian decoders: up to 1,048,576 Gaussians as a 3DGS PLY, and the camera the picture was seen from. BiRefNet cuts opaque pictures out. The two image encoders are gated (DINOv3 License; FLUX.2-dev''s repository terms): accept them on Hugging Face and name the files (local parts below).'
gpus: '0'
vram_gib: 6.0                    # B70 peak 5.0 GiB from a picture (encoders of the real shapes, random weights: the real ones are gated)
does: [generate, splat]
env:
  NS_M3D_B3D_DINO: '{dino}'
  NS_M3D_B3D_VAE: '{vae}'
local:
  dino: 'DINOv3 ViT-H+/16 model.safetensors (https://huggingface.co/facebook/dinov3-vith16plus-pretrain-lvd1689m, gated: accept the DINOv3 License, download it, set NS_M3D_B3D_DINO=<path> in nextsycl.conf)'
  vae: 'the FLUX.2 VAE vae/diffusion_pytorch_model.safetensors (https://huggingface.co/black-forest-labs/FLUX.2-dev, gated: accept its terms, download it, set NS_M3D_B3D_VAE=<path> in nextsycl.conf)'
files:
  denoiser:
    key: budget3d-idol
    url: https://huggingface.co/BudgetAny/Budget3D-Idol/resolve/96f1493a908eeb25a9aa278c445cb415b857070c/budget3d_idol.safetensors
    size: 1512422068
