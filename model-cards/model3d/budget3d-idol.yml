    path: budget3d-idol/budget3d_idol.safetensors
  idol:                          # Idol's own denoiser: its 8,192 Sobol token positions (pos_pe)
    key: idol-denoiser
    url: https://huggingface.co/speridlabs/idol/resolve/2731c2291fc65a797c5cb627a5e5526fc1490902/denoiser.safetensors
