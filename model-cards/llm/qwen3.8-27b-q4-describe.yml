# Qwen3.8-27B UD-Q4_K_M, pictures to prompts (image.describe; one card, 16K + 8K)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
# The same files as qwen3.8-27b-q4 (nothing new downloaded: the keys below are that card's), with a context sized for
# a picture and its prompt rather than a conversation, so it takes ~19.2 GiB of a card instead of 29 and sits beside an
# image model. image.describe picks it (the enabled chat model that reads pictures and takes the least memory) unless
# the loaded chat model reads pictures itself. docs/api/image-describe.md.
id: qwen3.8-27b-q4-describe
kind: llm
arch: qwen35
base_model: Qwen3.8-27B             # image.describe: the language model it is (image.describers)
title: Qwen3.8-27B UD-Q4_K_M, pictures to prompts (16K)
about: 'Qwen''s dense Qwen3.8 27B with its vision tower (Qwen3-VL''s ViT): reads a picture and writes the prompt that would draw it, for image.describe; Unsloth''s dynamic 4-bit, MTP drafts, a short context; no tools, no background tasks'
gpus: '0'
vram_gib: 20.0                   # its memory on the card when it runs (19.2 GiB measured on a B70 after describes)
ctx: '16384,8192'
tools: false
tasks: false
env: {}
silo:                   # its tuned kernels: kernels/llm/qwen35/silo (dist/silo/libnextsycl-qwen35.so)
  name: qwen35
  required: true        # no load on the shared kernels alone (2-4x slower decode)
files:
  model: q27-q4
  mtp: q27-mtp
  vision: q27-mmproj
guide: guides/chat.md
