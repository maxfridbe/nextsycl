# SeedVR2 (ByteDance-Seed): one-step diffusion video restoration and upscaling, 3B and 7B (image/seedvr2). The code
# (github.com/ByteDance-Seed/SeedVR) and the weights (huggingface.co/ByteDance-Seed/SeedVR2-3B, -7B: "SeedVR and
# SeedVR2 are licensed under the Apache 2.0") are Apache-2.0; the files here are numz's fp16 safetensors of them
# (huggingface.co/numz/SeedVR2_comfyUI, Apache-2.0) and the official positive prompt's embedding.
# An image-kind card: the image server serves image.upscale and video.upscale (the video kind is MiniMax H3's daemon)
id: seedvr2
kind: image
arch: seedvr2
title: 'SeedVR2 video upscaler (3B and 7B: one-step diffusion restoration, steady over time)'
about: 'ByteDance-Seed''s SeedVR2 as its official inference runs it: frames resized bicubic to the size asked, the causal 3-D VAE''s latent, one call of the NaDiT (3B: 32 blocks of 2560, mmrope; 7B: 36 of 3072) at t = 1000 with the fixed positive prompt, the decode and the wavelet colour fix. A clip goes through in chunks of 33 frames together (NS_SVR_CHUNK), 4 shared and crossfaded (NS_SVR_OVERLAP): natural detail on faces and skin, no per-frame flicker. Variants seedvr2-3b (default) and seedvr2-7b, scales 1 to 4'
gpus: '0'
vram_gib: 28.0                  # the 7B at 1728x960 (see docs/ports/seedvr2.md); the 3B takes less
defaults: {}
