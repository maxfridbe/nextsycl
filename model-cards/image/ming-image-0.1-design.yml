# Ming-Image-0.1-Design (text to image for UI, posters, infographics; RGBA; Rust + CUDA)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# The files are realrebelai's GGUFs (the DiT Q8_0, the text encoder - Ling-Mini-2.0 with the connector and the
# projections - Q4_K_M; that text encoder at the revision before its "UPDATED" re-upload) and Comfy-Org's VAE.
id: ming-image-0.1-design
kind: image
arch: ming-image
license: mit
commercial: true
license_note: 'Ming-Image 0.1 Design (inclusionAI, MIT); realrebelai''s GGUFs (the Ling-mini-2.0 text encoder with them) and Comfy-Org''s VAE repack state MIT too.'
title: 'Ming-Image 0.1 Design (text to image: UI, posters, infographics; RGBA; Rust + CUDA)'
about: 'inclusionAI''s Ming-Image-0.1-Design (MIT): Z-Image''s 6B single-stream DiT conditioned by Ling-Mini-2.0 (a 16B MoE, 1.4B active) through a 1.5B connector, an RGBA VAE; text-heavy designs; RGBA decoded (with these GGUFs its alpha comes back opaque). 6.8 GiB DiT, 9.2 GiB text encoder, nothing streamed'
gpus: '0,1'
split: true                      # nextsycl: the DiT and the VAE on the first card, the text encoder (9.2 GiB of Q4_K) on the second
vram_gib: 10.5                   # the first card's at 2048 x 2048 (weights 7.3, activations and the VAE's); the second's ~9.5
defaults:
  steps: 12
  cfg: 1.0
  sampler: euler
  schedule: shift
  size: 1024x1024
env: {}
