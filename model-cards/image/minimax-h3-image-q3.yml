title: 'MiniMax-H3-Image Q3_K_M (the smallest on the card; Rust + SYCL)'
about: 'as minimax-h3-image with Hearthscale''s Q3_K_M GGUF: its Q3_K matrices stay as stored on the card (7.7 GiB of blocks, 3.44 bits a value) and the engine''s silo expands them to bf16 a matrix at a time, at Q4_K_M''s speed; Q3_K''s error (the largest of the files, lettering still right at the default size). Without the silo they are read as Q6_K blocks (14.7 GiB)'
gpus: '0,1'
vram_gib: 12.5                  # B70, 4096x4096: 12.1 GiB peak (8.8 after load: Q3_K as stored)
defaults:
  steps: 6
  cfg: 1.0
  sampler: euler
  schedule: simple
  size: 2048x2048
env: {}
files:
  denoiser:
    key: h3i-denoiser-q3km
    url: https://huggingface.co/Hearthscale/MiniMax-H3-Image-GGUF/resolve/167c5e18db87d188575330ca76325e37cc2b28a4/minimax_h3_image_pruned-Q3_K_M.gguf
    size: 8768254560
