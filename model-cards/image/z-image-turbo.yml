# Z-Image-Turbo (text to image in 8 steps: photographs, English and Chinese text; Rust + SYCL)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets.
# The files are the official weights to the bit: unsloth's BF16 GGUF of the DiT (ComfyUI's layout; its 521 tensors
# equal Tongyi-MAI's float32 shards, whose every value is a bfloat16), ComfyUI's single-file Qwen3-4B (its 398
# tensors equal the official text encoder's shards), and the official VAE and tokenizer (Tongyi-MAI/Z-Image-Turbo @
# f332072a). docs/ports/z-image-turbo.md has the check.
id: z-image-turbo
kind: image
arch: z-image
license: apache-2.0
commercial: true
license_note: 'Apache-2.0 for the weights (Tongyi-MAI/Z-Image-Turbo) and the text encoder (Qwen3-4B); the GGUF and the single-file text encoder are repackings of them (unsloth, Comfy-Org), the VAE is the Flux.1 VAE as the model repository ships it'
title: 'Z-Image-Turbo (text to image in 8 steps: photographs, English and Chinese text; Rust + SYCL)'
about: 'Tongyi-MAI''s Z-Image-Turbo: a 6B single-stream DiT distilled to 8 steps without guidance, conditioned by Qwen3-4B''s hidden states, the Flux.1 VAE; BF16 (the official weights exactly), all on one card'
