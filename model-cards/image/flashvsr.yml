# FlashVSR v1.1 (OpenImagingLab): one-step diffusion video super-resolution, a clip as one stream (image/flashvsr). The
# code (github.com/OpenImagingLab/FlashVSR @ 0d403ee3: LICENSE Apache-2.0) and the weights (huggingface.co/
# JunhaoZhuang/FlashVSR-v1.1 @ 2aa7e1f3: `license: apache-2.0`) are Apache-2.0, without a non-commercial clause; the base
# model, Wan 2.1 T2V-1.3B, is Apache-2.0 too. The files: the DiT (float32 safetensors, made half at load), the LQ
# projection and the tiny conditional decoder (PyTorch checkpoints, read without unpickling code), and the official
# repository's fixed prompt embedding (examples/WanVSR/prompt_tensor/posi_prompt.pth). The silo's attention kernels are
# Intel's ARK (auto-round, MIT / Apache-2.0) on sycl-tla.
# An image-kind card: the image server serves image.upscale and video.upscale (the video kind is MiniMax H3's daemon)
id: flashvsr
kind: image
arch: flashvsr
license: apache-2.0
commercial: true
license_note: 'Apache-2.0 for the weights (JunhaoZhuang/FlashVSR-v1.1) and the code (OpenImagingLab/FlashVSR); the base model, Wan 2.1 T2V-1.3B, is Apache-2.0 too'
title: 'FlashVSR v1.1 video upscaler (one-step diffusion, the whole clip as one stream, 2x-4x; real footage and faces)'
about: 'OpenImagingLab''s FlashVSR v1.1: Wan 2.1 T2V-1.3B distilled to one step, streaming 8 frames a step with a KV cache of the last three latent pairs and locality-constrained block-sparse attention, a causal LQ projection in and a tiny conditional decoder out. Temporally steady, natural detail on real footage; a film runs as one stream (no seams, no length limit). The DiT 2.8 GB in half; one card holds the whole stream at 1728 x 960 and 2560 x 1408 out (x2 of the platform''s 864 x 480 and 1280 x 704); x4 runs in 2 x 2 tiles of 1792 x 1024. Request keys: scale 2-4, seed, and the options sparse_ratio (1.5), local_range (11), color_fix (1). Two cards: env NS_FVSR_GPUS 0,1 (the DiT''s blocks split, pipelined)'
gpus: '0,1'                     # the B70 and the B65 (shared with the studio): a copy a card, two clips at once
vram_gib: 18.0                  # one card at 1728 x 960 out: 17.3 GiB measured (2560 x 1408: 29.9; docs/ports/flashvsr.md)
defaults: {}
env: {}
