title: 'MiniMax-H3-Image Q4_K_M (text to image and edits up to 20 MP, 6 steps; Rust + SYCL)'
about: 'MiniMax''s image model on H3''s 50-block denoiser (Hearthscale''s Q4_K_M GGUF of Comfy-Org''s pruned bf16 file: Q4_K matrices expanded to bf16 a matrix at a time, 10.1 GiB of blocks on the card), its six-head bank on a six-step grid, H3''s Qwen3-VL 32B text encoder streamed from pinned memory, the 2D transformer VAE decoder; prompts rendered as written (no prompt enhancer)'
gpus: '0,1'
vram_gib: 15.0                  # B70, 4096x4096: 14.4 GiB peak (11.1 after load: blocks 10.1, VAE 0.75); the text encoder streams from pinned host memory (14.4 GiB RAM)
defaults:
  steps: 6
  cfg: 1.0
  sampler: euler
  schedule: simple
  size: 2048x2048
env: {}
files:
  denoiser:
    key: h3i-denoiser-q4km
    url: https://huggingface.co/Hearthscale/MiniMax-H3-Image-GGUF/resolve/167c5e18db87d188575330ca76325e37cc2b28a4/minimax_h3_image_pruned-Q4_K_M.gguf
    size: 11429589600
    sha256: 13fc0add19eaf268ac4ad38704e312c634627feb443ffa89c9a4dce6301926d2
    path: minimax-h3-image/diffusion_models/minimax_h3_image_pruned-Q4_K_M.gguf
  text-encoder: h3-te-32b-q4km
  tokenizer: h3-tokenizer-vocab
  tokenizer-merges: h3-tokenizer-merges
  tokenizer-config: h3-tokenizer-config
  vision: h3-te-visual
  vae:
    key: h3i-vae
    url: https://huggingface.co/Comfy-Org/MiniMax-H3-Image/resolve/892de7cb61df49753bf15145a711154803a355cb/vae/minimax_h3_image_vae_fp16.safetensors
    size: 1168505312
    sha256: d80e9c2e5cfc9844869961ff5a58c9a9e52182df6bfb30b26018dd7f348721af
    path: minimax-h3-image/vae/minimax_h3_image_vae_fp16.safetensors
guide: guides/minimax-h3-image.md
encoder:                         # its text encoder (image.describe describer native: none)
  name: Qwen3-VL-32B, MiniMax H3's
  sees: true
  why: 'the file stops after layer 50 of the 64, with no final norm or output head: it gives hidden states and cannot write text'
controls:                        # its request rules (model-cards/README.md, Image controls; schema 1)
  version: 1
  steps: {min: 4, max: 12, default: 6}      # the heads are distilled for 6; 3 left stray glyphs, 4 - 12 looked at whole
  cfg: null                      # distilled: no guidance, no negative prompt
  negative: false
  size:
    min_side: 512
    max_side: 5056
    multiple: 32
    max_pixels: 20971520         # 20 MiPx (4096 x 4096 looked at: sharp, lettering right)
    default: 2048x2048
    presets: {ratios: ['1:1', '4:3', '3:4', '3:2', '2:3', '16:9', '9:16'], pixels: [1048576, 4194304, 8388608, 16777216]}
  seed: true
  n: 8
  loras: true                    # on the blocks for the request (the pDMD 2-step LoRA brings its own steps and shift)
  edit:                          # picture 1 changed, up to 7 more as references; a strength below 1 starts from picture 1 too
    images: 8
    mask: false
    strength: true
    reference: true
    strength_with_reference: true
  transparent: false
  sampler: {values: [euler], default: euler}
  options:
    - {name: start-sigma, type: number, min: 0.05, max: 1, help: 'with a picture: the denoise starts at this sigma of its latents (the detail pass: 0.4 - 0.55)'}
  note: 'MiniMax-H3-Image (Q4_K_M): 6 steps without guidance, 1 to 20 MP (tuned for 2048 x 2048); edits with up to 7 references'
