# P-H3-Image's text encoder (Qwen3-VL-4B, int8 ConvRot) as a describer: image.describe describer native
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
# The P-H3-Image cards' own files (nothing new downloaded: the keys are p-h3-image's). The file holds the whole
# Qwen3-VL-4B language model under model.language_model. - 36 layers and the final norm; its head is tied to the token
# embedding (Qwen3-VL-4B ties them), which the file keeps - and the vision tower, so the encoder P-H3-Image conditions on
# can also write: image/vldescribe (arch qwen3vl-describe). The text connector in the file is not used.
id: qwen3-vl-4b-instruct
kind: image
arch: qwen3vl-describe
license: apache-2.0
commercial: true
license_note: 'the Qwen3-VL-4B parts of P-H3-Image''s text encoder file are Apache-2.0 (the file is distributed with P-H3-Image under the MiniMax H3 Community License: keep its NOTICE)'
title: 'P-H3-Image text encoder (Qwen3-VL-4B) as a describer'
about: 'the Qwen3-VL-4B text encoder P-H3-Image conditions on, loaded whole (its head tied to the embedding, vision tower) to write prompts from pictures: image.describe describer native for p-h3-image; int8 ConvRot, shared kernels, no prompt cache'
base_model: Qwen3-VL-4B
gpus: '0,1'
vram_gib: 8.0                    # an estimate until measured: 4.6 GiB int8 weights + the tower in float32 + the cache
env: {}
files:
  text-encoder: ph3-te-int8
  tokenizer: ph3-tokenizer
guide: guides/describe-native.md
