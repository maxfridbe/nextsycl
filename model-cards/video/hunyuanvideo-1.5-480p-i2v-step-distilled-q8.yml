license_note: 'Tencent Hunyuan Community License (HunyuanVideo-1.5): not licensed in the European Union, the United Kingdom or South Korea; a licence from Tencent above 100 million monthly active users; its Acceptable Use Policy; outputs may not improve another AI model. The DiT and VAE are the official float32 files (the DiT quantized to Q8_0 as it loads); the text encoders are HunyuanImage 2.1''s files: Qwen2.5-VL-7B (Apache-2.0, calcuis'' Q4_0 GGUF) and Glyph-SDXL-v2''s byT5 (calcuis/pig-encoder, MIT as that repository states). The image encoder is google/siglip-so400m-patch14-384 (Apache-2.0): the pipeline loads FLUX.1-Redux-dev''s image_encoder, an so400m-patch14-384 tower behind a gated non-commercial licence - checked 2026-11-23: its 448 tensors are google''s vision tower rounded to bfloat16, bit for bit, so google''s open float32 file is used (the same weights, finer).'
