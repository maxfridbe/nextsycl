about: Tencent's 8.3B video DiT, its step-distilled 480p image-to-video checkpoint (MeanFlow, 8 or 12 steps, no CFG) - the clip starts on the picture given (first_frame); its 3-D causal VAE (encoder and decoder), SigLIP's vision tower, HunyuanImage 2.1's text encoders
