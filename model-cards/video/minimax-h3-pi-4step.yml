# MiniMax H3 pi-H3 4-step DWD (int8: video with sound in 4 steps, the frames straight from the denoiser - no VAE decode)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
# Lakonik/pi-H3's 4-step DWD adapter: as minimax-h3-pi-2step (the same parts, the same merge at load), distilled for 4
# steps - max_raw_t 0.96, final step 0.6 (shift 12, the audio's 3), Euler from the noise itself, no CFG; the frames from
# the denoiser's last hidden states (crates/h3/src/piflow.rs, dwd.rs; docs/ports/pi-h3.md). Conditioning: a prompt, a
# first frame, a last frame - NOT reference pictures, clips or voices (ref2va: the minimax-h3-ref2va card).
id: minimax-h3-pi-4step
kind: video
arch: minimax-h3
title: 'MiniMax H3 pi-H3, 4 steps (int8 + DWD: text, first and last frame to video with sound; no reference pictures)'
about: Lakonik's pi-H3 4-step DWD adapter on the int8 FL2VA H3 - 4 denoiser steps, the frames from the denoiser's last hidden states (no VAE decode), stereo sound from H3's audio decoder; a prompt, a first frame and a last frame (no ref2va references)
license: minimax-h3-community
commercial: true
license_note: 'pi-H3''s adapters are Model Derivatives of MiniMax H3 (Hansheng Chen et al.; LakonLab), distributed under the MiniMax H3 Community License Agreement, as are H3''s denoiser, VAEs and the Qwen3-VL-32B text encoder as MiniMax ships it (Comfy-Org''s repack; the GGUF unsloth''s): not licensed in the European Union, the United Kingdom, the Republic of Korea or the United States of America; written authorization from MiniMax above US$20 million yearly revenue; products show "Powered by MiniMax H3"; its Acceptable Use Policy; outputs may not improve another model. Keep pi-H3''s NOTICE with copies. The encoder underneath is Qwen3-VL-32B (Apache-2.0); the Qwen2.5 tokenizer files come from ComfyUI''s GPL-3.0 repository. Not an official MiniMax product.'
gpus: '0'
defaults:
  steps: 4
  seconds: 5.0
  size: 832x480
env:
  H3_PI_STEPS: '4'
files:
  denoiser: h3-denoiser-int8
  text-encoder: h3-te-32b-q4km
  tokenizer: h3-tokenizer-vocab
  tokenizer-merges: h3-tokenizer-merges
  tokenizer-config: h3-tokenizer-config
  vae: h3-vae
  audio-vae: h3-audio-vae
  vision: h3-te-visual
  adapter:
    key: pi-h3-4step-dwd-int8
    url: https://huggingface.co/Lakonik/pi-H3/resolve/4a864589b0fac3d14768f932c930c4dcf1a17b56/pi_h3_4step_dwd_adapter_int8_convrot.safetensors
