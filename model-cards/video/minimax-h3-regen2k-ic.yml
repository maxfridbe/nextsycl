# MiniMax H3 Regenerate-2K IC (a 768p draft -> 2560x1440: Open-H3-Regenerate-2K-IC on the int8 Ref2VA denoiser)
# model card (model-cards/README.md): what `nextsycl models search | pull` offers and what the registry entry gets
# The draft-to-2K pipeline of NVlabs' Open-H3-Regenerate-2K-IC (ComfyUI-OpenH3Regenerate2KIC): the draft as <Video 1>,
# H3 VAE encode -> the 3D-conv latent upscaler -> HyperFlow 8-step + LMS Sharp + the IC LoRA, up3 / up4 / hf8 -> the H3
# video decoder -> the draft's sound. The `regen2k` job (crates/h3/src/regen.rs; video.generate's regen2k). Its base is
# the Ref2VA denoiser we already have (the int8 ComfyUI file: block 0's q matrix un-rotated is Diffusers' transformer_ref
# within int8's rounding, rel 0.9%); of the release's 66 GB base only what the curve form lacks is taken - the time
# embedder and the full AdaLN projections (26 GB, by byte range) - for HyperFlow's two-time embedding. The upscaler and
# LMS Sharp are the files we have (same SHA-256 as the release's). The blocks stream from the int8 file (the card for the
# ~177k-token 2K sequence: H3_RESIDENT_BLOCKS 0), the LoRAs from host memory (~12 GiB).
id: minimax-h3-regen2k-ic
kind: video
arch: minimax-h3
title: 'MiniMax H3 Regenerate-2K IC (a 768p draft to 2560x1440; Open-H3-Regenerate-2K-IC)'
about: NVlabs' Open-H3-Regenerate-2K-IC on the int8 Ref2VA denoiser - a 16:9 draft of 4.7 to 15.1 s (any size; longer than 124 frames in overlapping windows) made again at 2560x1440 with its faces, lip sync and lettering, its own sound kept; HyperFlow 8-step + LMS Sharp + the IC LoRA, 3 steps
license: minimax-h3-community
commercial: true
license_note: 'MiniMax H3 and its derivatives (the IC LoRA, HyperFlow, the fast decoder): the MiniMax H3 Community License (not licensed in the European Union, the United Kingdom, the Republic of Korea or the United States of America; written authorization from MiniMax above US$20 million yearly revenue; its Acceptable Use Policy; outputs may not train another model). The latent upscaler: Apache-2.0 weights. LMS Sharp: its author''s terms. Qwen3-VL text encoder: its licence. Not an official MiniMax product.'
gpus: '0'
does:
- regen2k                        # a draft made again at 2K: capabilities regenerate_2k, video_to_video, sound (the row); video.generate with regen2k
ram_gib: 12
defaults:
  steps: 3
  seconds: 5.17
  size: 2560x1440
env:
  H3_RESIDENT_BLOCKS: '0'
  # regen2k's decoder: fast (the release's fast decoder below, on the H3 video silo; the video decoder when the silo or the
  # room is missing) or standard (the H3 video decoder)
  H3_REGEN_VAE: 'fast'
