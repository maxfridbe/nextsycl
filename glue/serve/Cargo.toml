[package]
name = "nextsycl-serve"
description = "The servers: an OpenAI-compatible API over a kind's engine, the prompt cache, telemetry, the HTTP plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nextsycl-core.workspace = true
nextsycl-diffusion.workspace = true
nextsycl-llm.workspace = true
nextsycl-image.workspace = true
nextsycl-audio.workspace = true
nextsycl-model3d.workspace = true
nextsycl-tok.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
# the RPC methods are their handlers: vendor/rpcgen, from vibe-creative-platform (tooling/sync_rpcgen.sh)
rpcgen = { path = "../../vendor/rpcgen", default-features = false }
sha2 = "0.10"
