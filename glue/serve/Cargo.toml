[package]
name = "nextsycl-serve"
description = "The servers: an OpenAI-compatible API over a kind's engine, the prompt cache, telemetry, the HTTP plumbing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backplane-scheduler.workspace = true
nextsycl-core.workspace = true
nextsycl-diffusion.workspace = true
nextsycl-llm.workspace = true
nextsycl-image.workspace = true
nextsycl-audio.workspace = true
nextsycl-model3d.workspace = true
nextsycl-tok.workspace = true
serde_json.workspace = true
serde = { version = "1", features = ["derive"] }
# the RPC methods are their handlers: vendor/rpcgen, from vibe-creative-platform (tooling/sync_rpcgen.sh)
rpcgen = { path = "../../vendor/rpcgen", default-features = false }
sha2 = "0.10"
# an engine's inline markup kept by the speech text pass (AudioEngine::markup: regular expressions); the same crate
# as the tokenizers'
fancy-regex = "0.14"
# HTTPS beside the plain ports (tls.rs): rustls with the ring provider (the default aws-lc-rs builds a large C
# library with cmake), its own certificate parser (webpki: does a kept certificate still name this host), and the
# self-signed certificate made in-process by rcgen
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
