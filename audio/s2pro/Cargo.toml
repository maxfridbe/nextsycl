[package]
name = "nextsycl-audio-s2pro"
description = "Fish Audio S2 Pro on Intel Arc (SYCL): multilingual speech at 44.1 kHz - a Dual-AR model (a 36-layer Qwen3 slow model for each frame's semantic code, a 4-layer fast model for the other nine codes) over Fish's RVQ codec; voices cloned from a recording and its transcript, steered by free-form inline tags ([whisper], [laughing], [excited tone] ...), several speakers in one text"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nextsycl-core.workspace = true
nextsycl-diffusion.workspace = true
nextsycl-gguf.workspace = true
nextsycl-tok.workspace = true
nextsycl-audio.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
