<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 21 118 118" width="118" height="118">
  <!-- Left Icon: Aperture / Swiss Gear composed of 4 folding dynamic blades -->
  <g transform="translate(24, 15)">
    <!-- Outer precision calibration tick ring -->
    <circle cx="65" cy="65" r="56" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 6"/>
    <!-- 4 Curved overlapping blades representing the 4 runtime facets -->
    <!-- Blade 1: Video (top left arc) -->
    <path d="M 65 15 C 95 15 115 35 115 65 L 90 65 C 90 48 80 40 65 40 Z" fill="#ec4899"/>
    <!-- Blade 2: Chat (top right arc) -->
    <path d="M 115 65 C 115 95 95 115 65 115 L 65 90 C 80 90 90 80 90 65 Z" fill="#06b6d4"/>
    <!-- Blade 3: Image (bottom right arc) -->
    <path d="M 65 115 C 35 115 15 95 15 65 L 40 65 C 40 80 50 90 65 90 Z" fill="#f59e0b"/>
    <!-- Blade 4: Audio (bottom left arc) -->
    <path d="M 15 65 C 15 35 35 15 65 15 L 65 40 C 50 40 40 50 40 65 Z" fill="#8b5cf6"/>
    <!-- Center hub: 'N' Monogram core in the aperture center -->
    <circle cx="65" cy="65" r="22" fill="#020617" stroke="#2dd4bf" stroke-width="2.5"/>
    <!-- Stylized N in center -->
    <path d="M 57 74 L 57 56 L 62 56 L 70 69 L 70 56 L 74 56 L 74 74 L 69 74 L 61 61 L 61 74 Z" fill="#ffffff"/>
    <!-- Swiss red locator dot -->
    <circle cx="65" cy="18" r="3" fill="#ef4444"/>
  </g>

</svg>
